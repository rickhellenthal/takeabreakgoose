# Packs the app with Velopack for Windows, and for Apple Silicon and Intel Macs (mac-build.yml), and
# only once all three are packed, publishes them together as a GitHub release. Installed apps update
# themselves from these releases (App/Platform/Updater.cs; see docs/in-app-updates.md).
# Runs when a version tag is pushed, e.g.:  git tag v1.11.0 && git push origin v1.11.0
# A tag with a dash (v1.11.0-beta.1) becomes a pre-release: only pre-releases update to those, so
# it's a way to try a release before everyone gets it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}
  REPO_URL: https://github.com/${{ github.repository }}
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The version (1.11.0) from the tag (v1.11.0); --pre for vpk when it's a pre-release.
      - name: Work out the version from the tag
        id: version
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "pre=--pre" >> "$GITHUB_OUTPUT"; else echo "pre=" >> "$GITHUB_OUTPUT"; fi

      - name: Run the tests
        run: dotnet test tests/TakeABreakGoose.Tests -c Release

      - name: Run the Windows tests
        run: dotnet test tests/TakeABreakGoose.Windows.Tests -c Release

      # Self-contained, so friends don't need to install .NET first.
      - name: Publish the app
        run: >
          dotnet publish App/TakeABreakGoose.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # release-notes/<tag>.md: packed with the update (for the "what's new" window) and the
      # release's description on GitHub (which the app reads for versions it skipped).
      # Without one, GitHub's list of commits since the last release.
      - name: Get the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f "release-notes/$TAG.md" ]]; then
            cp "release-notes/$TAG.md" notes.md
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

      - name: Install Velopack
        run: dotnet tool install -g vpk --version $VPK_VERSION

      # The previous release, to make a small delta update from. Releases before Velopack have none.
      - name: Download the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          vpk download github --repoUrl $REPO_URL --token $GH_TOKEN --channel win ${{ steps.version.outputs.pre }} -o Releases
          || echo "Nothing to make a delta from."

      - name: Pack with Velopack
        run: >
          vpk pack -u TakeABreakGoose -v ${{ steps.version.outputs.version }} -p publish -e TakeABreakGoose.exe
          --packTitle "Take a Break Goose" --packAuthors "Rick Hellenthal"
          -i Assets/goose.ico --shortcuts StartMenuRoot -r win-x64 --channel win -o Releases
          --releaseNotes notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: Releases/*

  # The Mac app, packed for both kinds of Mac (see mac-build.yml).
  mac:
    needs: release
    uses: ./.github/workflows/mac-build.yml
    with:
      release-tag: ${{ github.ref_name }}

  # Everything at once, so the release never goes out without the Mac files, and not at all when a
  # build failed.
  publish:
    needs: [release, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Work out the version from the tag
        id: version
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "pre=--pre" >> "$GITHUB_OUTPUT"; else echo "pre=" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: actions/download-artifact@v4
        with:
          pattern: "{win,mac-arm64,mac-x64}"
          merge-multiple: true
          path: Releases

      - name: Install Velopack
        run: dotnet tool install -g vpk --version $VPK_VERSION

      # The first upload creates the release; the others add their files to it.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for channel in win osx-arm64 osx-x64; do
            merge=$([[ $channel == win ]] || echo --merge)
            vpk upload github --repoUrl $REPO_URL --token $GH_TOKEN --channel $channel -o Releases \
              ${{ steps.version.outputs.pre }} --publish $merge --tag "$TAG" --targetCommitish "$GITHUB_SHA" \
              --releaseName "Take a Break Goose ${{ steps.version.outputs.version }}"
          done
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
