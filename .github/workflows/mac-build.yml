# Builds the macOS app without making a release, to try it out. Runs on every push to a branch
# other than main (GitHub only offers "Run workflow" by hand for workflows that are on main), and
# from the Actions tab ("Mac build" → Run workflow) once it is. The .dmgs are under the run's Artifacts.
name: Mac build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run the tests
        if: matrix.arch == 'arm64'
        run: dotnet test tests/TakeABreakGoose.Tests -c Release

      - name: Build the .dmg
        run: Mac/package.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.dmg
